[project]
name = "te-agent"
version = "0.1.0"
description = "Two-phase agent that specs then implements Team Engine's matching algorithm"
readme = "README.md"
requires-python = ">=3.12"

# Deliberately the only dependency. Do NOT add python-dotenv: .env holds a live
# ANTHROPIC_API_KEY, and loading it would silently switch billing from the Max
# subscription to API credits. `te-agent doctor` aborts if the variable is set.
dependencies = [
    "claude-agent-sdk>=0.2.135",
]

[project.scripts]
te-agent = "te_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["te_agent"]
